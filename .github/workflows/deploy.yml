# Builds and deploys on every push to main (Cloudflare): the vault to pitwall-auth.garvit.in (vault/wrangler.jsonc),
# then the app to pitwall.plusminushalf.com (wrangler.jsonc). The vault goes first, so the app never points at a
# vault that isn't there yet.
# Repo secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers", zones plusminushalf.com and garvit.in) and
# CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order; a newer push replaces any deploy still waiting.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run vault:deploy
      # Circuit history from the latest F1DB release into public/history/. Nothing reads it yet, so a failure
      # (GitHub down, F1DB renamed a circuit) doesn't hold the deploy: the app treats missing files as no history.
      - run: bun run history
        continue-on-error: true
      - run: bun run deploy
